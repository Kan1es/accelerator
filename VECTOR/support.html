<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕКТОР - Поддержка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0D0D0D] text-white font-sora h-screen flex flex-col">
    <header class="p-3 md:px-10 flex flex-col md:flex-row justify-between items-center gap-6 z-50 relative">
        <div class="flex items-center gap-4">
            <img src="ВЕКТОР.svg" class="w-14 h-14 md:w-14 md:h-14" alt="Logo">
            <span class="text-2xl md:text-5xl font-semibold tracking-tighter uppercase">ВЕКТОР</span>
        </div>
        <nav class="flex flex-wrap justify-center gap-4 md:gap-12 items-center">
            <a href="support.html" class="nav-item active-tab text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] ">Поддержка</a>
            <a href="index.html" class="nav-item active:text-[#CC6200] text-m md:text-xl font-light">Пользователю</a>
            <a href="roles.html" class="nav-item text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">Сотруднику</a>
            
        </nav>
    </header>

    <main class="flex-1 flex flex-col relative max-w-5xl mx-auto w-full px-4 md:px-10 overflow-hidden">
        <div id="chat-box" class="flex-1 overflow-y-auto pt-6 space-y-6 pb-4">
            <div class="flex gap-4 md:gap-6 animate-gentle">
                <div class="w-10 h-10 md:w-12 md:h-12 bg-[#FF7A00] shrink-0 rounded-xl flex items-center justify-center">
                    <img src="ВЕКТОР.svg" class="w-6 h-6 md:w-8 md:h-8 brightness-0">
                </div>
                <div class="space-y-2">
                    <p class="text-[14px] text-[#FF7A00] font-bold tracking-widest uppercase">ВЕКТОР</p>
                    <div class="bg-[#151515] border border-[#2A2A2A] p-4 md:p-6 rounded-[20px] rounded-tl-none text-sm md:text-md leading-relaxed">
                        Здравствуйте, {Пользователь}! Вам ответит первый освободившийся оператор. Подсказать что-то сейчас?
                    </div>
                </div>
            </div>
        </div>

        <div class="pb-6 md:pb-10 space-y-4">
            <div class="flex flex-col md:flex-row gap-2 justify-end">
                <button class="support-btn w-full md:w-auto">Нет, соедини с оператором</button>
                <button class="support-btn w-full md:w-auto border-[#FF7A00] text-white">Да, давай попробуем</button>
            </div>
            <div class="relative flex items-center">
                <button class="absolute left-4 md:left-6 top-1/2 -translate-y-1/2 text-[#6B6B6B] text-5xl">+</button>
                <input type="text" placeholder="Сообщение..." class="w-full bg-[#151515] border border-[#2A2A2A] rounded-2xl py-4 md:py-6 px-12 md:px-16 outline-none text-sm md:text-lg">
                <button class="absolute right-4 md:right-6 top-1/2 -translate-y-1/2 text-[#FF7A00]">
                     <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
    </main>
</body>
</html>

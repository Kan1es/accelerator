<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕКТОР - Чат</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="bg-[#0D0D0D] text-white font-sora h-screen flex overflow-hidden">

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo-group">
                <a href="index.html" class="flex gap-4 items-center">
                    <img src="images/ВЕКТОР.svg" class="logo-img">
                    <span class="text-2xl">ВЕКТОР</span>
                </a>
                
            
                <button onclick="toggleSidebar()" class="sidebar-toggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                </button>
            </div>
        </div>
        
        <div class="sidebar-content">
            <div class="user-card">
                <div class="user-info">
                    <p class="user-name font-semibold text-m">Имя пользователя</p>
                    <p class="user-role font-light text-sm text-[#6B6B6B]">Пользователь</p>
                </div>
            </div>
            
            <nav class="nav-menu">
                <a class="sdbar-item" href="support.html">
                
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span>Чат с оператором</span>
                
                </a>
                <div class="sdbar-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <span>Папка запросов</span>
                </div>
                
                <div class="history-section">
                    <p class="section-title">Ваши чаты</p>
                    </div>
            </nav>
        </div>

        <a href="index.html" class="nav-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            На главную
        </a>
    </aside>

    <main class="main-content">
        <header class="main-header">
            <button id="sidebar-open" onclick="toggleSidebar()" class="hidden-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </button>
            <div class="spacer"></div>
            <a href="index.html" class="header-return">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Вернуться
            </a>
        </header>

        <div id="chat-box" class="messages-area">
            </div>

        <div class="input-area">
            <div class="input-container">
                <button class="icon-btn left-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <input type="text" id="user-input" placeholder="Спросите о чем-нибудь...">
                <button class="icon-btn right-icon" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
            <p class="input-note">Будьте внимательны, Вы ведёте диалог с искусственным интеллектом, он может допускать ошибки</p>
        </div>
    </main>

    <script src="scripts/api.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>

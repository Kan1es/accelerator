<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕКТОР — Менеджер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles_manager.css">
</head>

<body class="bg-[#0D0D0D] text-white font-sora h-screen flex flex-col overflow-x-hidden">

    <header class="p-3 md:px-10 flex flex-col md:flex-row justify-between items-center gap-6 z-50 relative shrink-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-6"><img src="images/ВЕКТОР.svg"
                    class="w-14 h-14 md:w-14 md:h-14" alt="Logo">
                <span class="text-2xl md:text-5xl font-semibold tracking-tighter uppercase">ВЕКТОР</span>
            </a>
        </div>
        <nav class="flex flex-wrap justify-center gap-4 md:gap-12 items-center">
            <a href="manager_dashboard.html" class="nav-item text-m md:text-xl font-light text-[#CC6200]">Главная</a>
            <a href="manager_workers.html"
                class="nav-item text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">Работники</a>
            <a href="manager_tasks.html"
                class="nav-item text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">Все
                задачи</a>
            <a href="chat.html"
                class="nav-item text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">ИИ Чат</a>
            <button onclick="window.api && window.api.logout()" class="nav-item text-m md:text-xl font-light hover:text-red-400 transition-colors">Выйти</button>
        </nav>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 px-4 md:px-10 pb-6 lg:flex-1 lg:min-h-0">

        <div class="lg:col-span-3 flex flex-col gap-4 min-h-0 order-2 lg:order-1 h-auto lg:h-full">

            <div class="card p-4 shrink-0">
                <div class="flex items-center gap-3 mb-3">
                    <div id="mgr-profile-avatar" class="avatar w-12 h-12 text-xs">—</div>
                    <div>
                        <p id="mgr-profile-name" class="font-medium text-sm">—</p>
                        <p id="mgr-profile-role" class="text-[11px] text-[#6B6B6B]">—</p>
                    </div>
                </div>
                <p class="text-[10px] text-[#6B6B6B] mb-1">Выполнено задач отделом за неделю</p>
                <div class="progress-bar-outer">
                    <div id="mgr-profile-progress" class="progress-bar-inner" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[10px] text-[#6B6B6B] mt-1">
                    <span id="mgr-profile-done">0</span>
                    <span id="mgr-profile-total" class="text-white font-medium">из 0</span>
                </div>
            </div>


            <div class="card flex flex-col overflow-hidden min-h-[200px] lg:flex-1">
                <div class="px-3 py-2.5 border-b border-[#2A2A2A] shrink-0">
                    <p class="text-xs text-center text-[#B3B3B3]">Статусы работников</p>
                </div>
                <div id="mgr-employees-list" class="flex-1 overflow-y-auto custom-scrollbar">
                    <p class="text-xs text-[#6B6B6B] text-center p-4">Загрузка…</p>
                </div>
                <div class="px-3 py-2.5 border-t border-[#2A2A2A] shrink-0">
                    <button class="text-xs text-[#6B6B6B] hover:text-[#FF7A00] w-full text-center transition-colors">
                        Просмотреть всех работников
                    </button>
                </div>
            </div>
        </div>


        <div class="lg:col-span-6 flex flex-col gap-4 min-h-0 order-1 lg:order-2 h-auto lg:h-full">

            <div class="add-task-bar shrink-0 mb-11">
                <span id="open-task-modal" class="flex flex-1">
                    <input type="text" placeholder="Добавьте новую задачу"
                        class="flex-1 bg-transparent outline-none text-sm text-white placeholder:text-[#6B6B6B]"
                        readonly>
                    <button
                        class="w-7 h-7 bg-[#FFF] rounded-md flex items-center justify-center hover:bg-[#FF9A3C] active:bg-[#FF7A00] transition-colors shrink-0">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3">
                            <line x1="12" y1="5" x2="12" y2="19" />
                            <line x1="5" y1="12" x2="19" y2="12" />
                        </svg>
                    </button>
                </span>

            </div>

            <div id="mgr-active-tasks" class="overflow-y-auto custom-scrollbar space-y-3 pr-1 lg:flex-1">
                <h2 class="text-xl font-medium sticky top-0 bg-[#0D0D0D] pt-2 z-10">Задачи в работе</h2>
                <p class="text-xs text-[#6B6B6B] py-4">Загрузка…</p>
            </div>
            <div class="flex justify-center gap-2 py-2">
                <span class="w-1.5 h-1.5 rounded-full bg-[#2A2A2A]"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-[#2A2A2A]"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-[#2A2A2A]"></span>
            </div>
        </div>

        <div class="lg:col-span-3 flex flex-col min-h-0 order-3 h-auto lg:h-full ">
            <div class="card flex flex-col overflow-hidden min-h-[200px] lg:flex-1 ">
                <div class="flex-1 overflow-y-auto custom-scrollbar ">
                    <div id="mgr-notif-list" class="flex flex-col">
                        <p class="text-xs text-[#6B6B6B] text-center p-4">Загрузка…</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div id="task-toast"
        class="fixed top-6 left-1/2 -translate-x-1/2 translate-y-[-20px] opacity-0 pointer-events-none z-[100] 
           bg-[#151515] border border-[#FF7A00]/40 text-white px-5 py-3 rounded-[8px] shadow-lg transition-all duration-300">
        Задача успешно отправлена
    </div>

    <div id="task-modal"
        class="fixed inset-0 bg-black/70 backdrop-blur-[2px] z-[90] hidden items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-[#151515] border border-white/10 rounded-[8px] p-6 md:p-8 relative">

            <button id="close-task-modal"
                class="absolute top-4 right-4 text-[#6B6B6B] hover:text-[#FF7A00] text-2xl leading-none">
                &times;
            </button>

            <h2 class="text-2xl font-[500] mb-6">Новая задача</h2>

            <form id="task-form" class="space-y-5">
                <div>
                    <label class="block text-sm text-[#B3B3B3] mb-2">Название задачи</label>
                    <input type="text" name="title" required class="modal-input"
                        placeholder="Например: Проверка оборудования">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-[#B3B3B3] mb-2">Срок сдачи — дата</label>
                        <input type="date" name="date" required class="modal-input">
                    </div>

                    <div>
                        <label class="block text-sm text-[#B3B3B3] mb-2">Время</label>
                        <input type="time" name="time" required class="modal-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-[#B3B3B3] mb-2">Важность (1–10)</label>
                        <select name="priority" required class="modal-input">
                            <option value="3">Низкая (3)</option>
                            <option value="5" selected>Средняя (5)</option>
                            <option value="7">Высокая (7)</option>
                            <option value="10">Критическая (10)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-[#B3B3B3] mb-2">Категория</label>
                        <select name="category_id" id="task-form-category" required class="modal-input">
                            <option value="">Загрузка…</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-[#B3B3B3] mb-2">Исполнитель</label>
                    <select name="assignee_id" id="task-form-assignee" required class="modal-input">
                        <option value="">Загрузка…</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-[#B3B3B3] mb-2">Описание задачи</label>
                    <textarea name="comment" rows="4" class="modal-input resize-none"
                        placeholder="Опишите задачу подробнее: что нужно сделать, особенности, приоритетные детали"></textarea>
                </div>

                <div id="task-form-error" class="text-red-400 text-sm hidden"></div>

                <div class="pt-2 flex justify-end">
                    <button type="submit"
                        class="px-5 py-3 bg-[#FF7A00] text-white rounded-[5px] hover:bg-[#e56f00] transition-colors font-[500]">
                        Добавить задачу
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script src="scripts/ws.js"></script>
    <script src="scripts/script_manager.js"></script>
</body>

</html>

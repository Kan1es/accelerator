<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕКТОР - Выбор роли</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body class="bg-[#0D0D0D] text-white font-sora h-screen flex flex-col overflow-x-hidden">

    <header class="p-3 md:px-10 flex flex-col md:flex-row justify-between items-center gap-6 z-50 relative">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-6"><img src="images/ВЕКТОР.svg"
                    class="w-14 h-14 md:w-14 md:h-14" alt="Logo">
                <span class="text-2xl md:text-5xl font-semibold tracking-tighter uppercase">ВЕКТОР</span>
            </a>
        </div>
        <nav class="flex flex-wrap justify-center gap-4 md:gap-12 items-center">
            <a href="roles.html"
                class="nav-item active-tab text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">Сотруднику</a>
            <a href="index.html" class="nav-item text-m md:text-xl font-light">Пользователю</a>
            <a href="support.html"
                class="nav-item text-m md:text-xl opacity-100 font-light hover:text-[#FF9A3C] active:text-[#CC6200]">Поддержка</a>
        </nav>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="h-16 mb-8 md:mb-16">
            <h1 class="text-2xl md:text-5xl font-light text-center">
                <span id="tw-role"></span><span class="cursor-blink text-[#FF7A00]">|</span>
            </h1>
        </div>

        <div class="roles-wrapper flex flex-wrap items-center justify-center gap-6 md:gap-12 w-full max-w-6xl">

            <a id="card-emp" class="role-card" href="employee_dashboard.html">
                <img src="images/hammer.png" class="card-icon hammer-anim" alt="">
                <span class="role-title">Я сотрудник</span>
            </a>

            <div class="arrows-container flex flex-col gap-6 md:gap-10">
                <svg id="arrow-to-mgr" class="arrow-hor" width="60" height="30" viewBox="0 0 60 30" fill="currentColor">
                    <path d="M60 15L40 0V30L60 15ZM0 17.5H45V12.5H0V17.5Z" />
                </svg>
                <svg id="arrow-to-emp" class="arrow-hor" width="60" height="30" viewBox="0 0 60 30" fill="currentColor">
                    <path d="M0 15L20 30V0L0 15ZM60 12.5H15V17.5H60V12.5Z" />
                </svg>
            </div>

            <a id="card-mgr" class="role-card" href="manager_dashboard.html">
                <img src="images/tie.png" class="card-icon tie-anim" alt="">
                <span class="role-title">Я управляющий</span>
            </a>

        </div>
    </main>

    <script src="scripts/script.js"></script>
</body>
